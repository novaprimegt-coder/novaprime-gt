name: Bootstrap NovaPrime GT v11.24

on:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: novaprime-bootstrap-pages
  cancel-in-progress: false

jobs:
  bootstrap-and-deploy:
    if: ${{ !contains(github.event.head_commit.message, '[bootstrap-output]') }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rebuild canonical NovaPrime GT v11.24
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_REPO="https://raw.githubusercontent.com/novaprimegt-coder/gestion-tareas"
          SOURCE_COMMIT="3ac4e828e59ad126181652dde5c2bf762ac40c6a"
          SOURCE_PATH="novaprime-gt-app/public/releases/v11.24/parts19"
          EXPECTED_B64_BYTES="550452"
          EXPECTED_GZIP_BYTES="412839"
          EXPECTED_GZIP_SHA="22b2c1ee90f891a5d257662728cc9ba5dcb1f41fb756bb38d1c6651381e8fdb4"
          EXPECTED_HTML_BYTES="1351125"
          EXPECTED_HTML_SHA="71c7f0e7faa1ae682cb59615b5e09e7671b67ccfc736eaffaddbeb4bf0933d03"

          rm -rf public
          mkdir -p public /tmp/novaprime-parts
          : > /tmp/novaprime.b64.raw

          for n in $(seq -w 0 28); do
            file="p${n}.txt"
            url="${SOURCE_REPO}/${SOURCE_COMMIT}/${SOURCE_PATH}/${file}"
            echo "Downloading ${file}"
            curl --fail --location --silent --show-error --retry 5 --retry-all-errors \
              "$url" -o "/tmp/novaprime-parts/${file}"
            cat "/tmp/novaprime-parts/${file}" >> /tmp/novaprime.b64.raw
          done

          tr -d '[:space:]' < /tmp/novaprime.b64.raw > /tmp/novaprime.b64
          test "$(wc -c < /tmp/novaprime.b64 | tr -d ' ')" = "$EXPECTED_B64_BYTES"

          base64 --decode /tmp/novaprime.b64 > /tmp/novaprime.html.gz
          test "$(wc -c < /tmp/novaprime.html.gz | tr -d ' ')" = "$EXPECTED_GZIP_BYTES"
          echo "${EXPECTED_GZIP_SHA}  /tmp/novaprime.html.gz" | sha256sum --check --strict
          gzip -t /tmp/novaprime.html.gz

          gzip -dc /tmp/novaprime.html.gz > public/index.html
          test "$(wc -c < public/index.html | tr -d ' ')" = "$EXPECTED_HTML_BYTES"
          echo "${EXPECTED_HTML_SHA}  public/index.html" | sha256sum --check --strict

          grep -qi '^<!doctype html' public/index.html
          grep -q 'NovaPrime GT' public/index.html
          grep -qi '</html>' public/index.html

      - name: Validate inline JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, subprocess, tempfile, pathlib
          html = pathlib.Path('public/index.html').read_text(encoding='utf-8')
          scripts = []
          pattern = re.compile(r'<script\b([^>]*)>(.*?)</script\s*>', re.I | re.S)
          for m in pattern.finditer(html):
              attrs, body = m.group(1), m.group(2)
              if re.search(r'\bsrc\s*=', attrs, re.I):
                  continue
              mt = re.search(r'\btype\s*=\s*["\']([^"\']+)["\']', attrs, re.I)
              script_type = (mt.group(1).strip().lower() if mt else '')
              if script_type not in ('', 'text/javascript', 'application/javascript', 'module'):
                  continue
              scripts.append((body, script_type == 'module'))
          if not scripts:
              raise SystemExit('No inline JavaScript blocks found')
          for i, (body, module) in enumerate(scripts, 1):
              suffix = '.mjs' if module else '.js'
              with tempfile.NamedTemporaryFile('w', encoding='utf-8', suffix=suffix, delete=False) as f:
                  f.write(body)
                  name = f.name
              result = subprocess.run(['node', '--check', name], text=True, capture_output=True)
              pathlib.Path(name).unlink(missing_ok=True)
              if result.returncode:
                  print(result.stdout)
                  print(result.stderr)
                  raise SystemExit(f'JavaScript syntax error in inline block {i}')
          print(f'Validated {len(scripts)} inline JavaScript blocks with node --check')
          PY

      - name: Materialize validated HTML in main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Materializa NovaPrime GT v11.24 validado [bootstrap-output]"
            git push origin HEAD:main
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
