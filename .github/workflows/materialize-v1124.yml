name: Materialize NovaPrime GT v11.24

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/materialize-v1124.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: novaprime-materialize-v1124
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify canonical v11.24
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_REPO="https://raw.githubusercontent.com/novaprimegt-coder/gestion-tareas"
          SOURCE_COMMIT="3ac4e828e59ad126181652dde5c2bf762ac40c6a"
          SOURCE_PATH="novaprime-gt-app/public/releases/v11.24/parts19"
          EXPECTED_B64_BYTES="550452"
          EXPECTED_GZIP_BYTES="412839"
          EXPECTED_GZIP_SHA="22b2c1ee90f891a5d257662728cc9ba5dcb1f41fb756bb38d1c6651381e8fdb4"
          EXPECTED_HTML_BYTES="1351125"
          EXPECTED_HTML_SHA="71c7f0e7faa1ae682cb59615b5e09e7671b67ccfc736eaffaddbeb4bf0933d03"

          rm -rf /tmp/np-v1124
          mkdir -p /tmp/np-v1124/parts
          : > /tmp/np-v1124/app.b64.raw

          for n in $(seq -w 0 28); do
            f="p${n}.txt"
            curl --fail --location --silent --show-error --retry 5 --retry-all-errors \
              "${SOURCE_REPO}/${SOURCE_COMMIT}/${SOURCE_PATH}/${f}" \
              -o "/tmp/np-v1124/parts/${f}"
            expected=19000
            [ "$n" = "28" ] && expected=18452
            actual="$(tr -d '[:space:]' < "/tmp/np-v1124/parts/${f}" | wc -c | tr -d ' ')"
            test "$actual" = "$expected"
            cat "/tmp/np-v1124/parts/${f}" >> /tmp/np-v1124/app.b64.raw
          done

          tr -d '[:space:]' < /tmp/np-v1124/app.b64.raw > /tmp/np-v1124/app.b64
          test "$(wc -c < /tmp/np-v1124/app.b64 | tr -d ' ')" = "$EXPECTED_B64_BYTES"
          base64 --decode /tmp/np-v1124/app.b64 > /tmp/np-v1124/app.html.gz
          test "$(wc -c < /tmp/np-v1124/app.html.gz | tr -d ' ')" = "$EXPECTED_GZIP_BYTES"
          echo "${EXPECTED_GZIP_SHA}  /tmp/np-v1124/app.html.gz" | sha256sum --check --strict
          gzip -t /tmp/np-v1124/app.html.gz
          gzip -dc /tmp/np-v1124/app.html.gz > /tmp/np-v1124/index.html
          test "$(wc -c < /tmp/np-v1124/index.html | tr -d ' ')" = "$EXPECTED_HTML_BYTES"
          echo "${EXPECTED_HTML_SHA}  /tmp/np-v1124/index.html" | sha256sum --check --strict
          grep -qi '^<!doctype html' /tmp/np-v1124/index.html
          grep -q 'NovaPrime GT' /tmp/np-v1124/index.html
          grep -qi '</html>' /tmp/np-v1124/index.html

      - name: Validate inline JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, subprocess, tempfile, pathlib
          html=pathlib.Path('/tmp/np-v1124/index.html').read_text(encoding='utf-8')
          scripts=[]
          for m in re.finditer(r'<script\b([^>]*)>(.*?)</script\s*>',html,re.I|re.S):
              attrs,body=m.group(1),m.group(2)
              if re.search(r'\bsrc\s*=',attrs,re.I): continue
              mt=re.search(r'\btype\s*=\s*["\']([^"\']+)["\']',attrs,re.I)
              typ=(mt.group(1).strip().lower() if mt else '')
              if typ not in ('','text/javascript','application/javascript','module'): continue
              scripts.append((body,typ=='module'))
          if not scripts: raise SystemExit('No inline JavaScript blocks found')
          for i,(body,module) in enumerate(scripts,1):
              suffix='.mjs' if module else '.js'
              with tempfile.NamedTemporaryFile('w',encoding='utf-8',suffix=suffix,delete=False) as f:
                  f.write(body); name=f.name
              r=subprocess.run(['node','--check',name],capture_output=True,text=True)
              pathlib.Path(name).unlink(missing_ok=True)
              if r.returncode:
                  print(r.stdout); print(r.stderr)
                  raise SystemExit(f'JavaScript syntax error in inline block {i}')
          print(f'Validated {len(scripts)} inline JavaScript blocks')
          PY

      - name: Commit complete application to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p public
          cp /tmp/np-v1124/index.html public/index.html
          git add public/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Materializa NovaPrime GT v11.24 completo"
            git push origin HEAD:main
          fi

      - name: Replace gh-pages loader with direct HTML
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/np-v1124/index.html /tmp/novaprime-direct-index.html
          git fetch origin gh-pages
          git switch gh-pages
          cp /tmp/novaprime-direct-index.html index.html
          touch .nojekyll
          git add index.html .nojekyll
          if ! git diff --cached --quiet; then
            git commit -m "Publica NovaPrime GT v11.24 directo"
            git push origin HEAD:gh-pages
          fi
