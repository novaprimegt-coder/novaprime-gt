<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#030914">
<title>NovaPrime GT</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#030914;color:#e8f1ff;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}body{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 20% 10%,#073044 0,transparent 32%),radial-gradient(circle at 80% 90%,#11153d 0,transparent 30%),#030914}.card{width:min(560px,100%);text-align:center}.icon{width:86px;height:86px;margin:0 auto 24px;border:1px solid #0ddcff55;border-radius:24px;display:grid;place-items:center;background:#071829;box-shadow:0 0 50px #00d5ff14}.icon svg{width:44px;height:44px;stroke:#00ddff;fill:none;stroke-width:2}.title{font-size:clamp(34px,9vw,54px);font-weight:850;letter-spacing:-1.8px;margin:0;background:linear-gradient(90deg,#08d9ff,#6d83ff);-webkit-background-clip:text;color:transparent}.version{margin:10px 0 32px;color:#8290b1;font-weight:750;letter-spacing:4px;font-size:13px}.status{font-size:17px;line-height:1.55;color:#c3cce0;min-height:54px}.bar{height:7px;background:#0b1930;border-radius:999px;overflow:hidden;margin:22px 0 10px;border:1px solid #193454}.fill{height:100%;width:4%;background:linear-gradient(90deg,#00dbff,#667dff);border-radius:inherit;transition:width .25s ease}.detail{font-size:12px;color:#687696;min-height:36px;word-break:break-word}.retry{display:none;margin:20px auto 0;border:1px solid #05d8ff66;background:#062033;color:#82edff;border-radius:14px;padding:13px 22px;font-weight:800;font-size:15px}.foot{margin-top:28px;color:#52607d;font-size:12px}.error .status{color:#ffb7bd}.error .retry{display:inline-block}
</style>
</head>
<body>
<main class="card" id="card">
  <div class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M7 10h7M7 14h5M17 4v4M19 4v4"/></svg></div>
  <h1 class="title">NovaPrime GT</h1>
  <div class="version">V11.24 · CARGA VERIFICADA</div>
  <div class="status" id="status">Preparando NovaPrime GT…</div>
  <div class="bar"><div class="fill" id="fill"></div></div>
  <div class="detail" id="detail">Repositorio independiente · HTTPS · SHA-256</div>
  <button class="retry" id="retry" type="button">Reintentar</button>
  <div class="foot">NovaPrime GT · Integridad validada antes de iniciar</div>
</main>
<script>
(() => {
'use strict';
const VERSION='11.24';
const SOURCE_COMMIT='3ac4e828e59ad126181652dde5c2bf762ac40c6a';
const BASE=`https://raw.githubusercontent.com/novaprimegt-coder/gestion-tareas/${SOURCE_COMMIT}/novaprime-gt-app/public/releases/v11.24/parts19`;
const PARTS=Array.from({length:29},(_,i)=>`p${String(i).padStart(2,'0')}.txt`);
const EXPECTED_B64=550452;
const EXPECTED_GZIP=412839;
const EXPECTED_GZIP_SHA='22b2c1ee90f891a5d257662728cc9ba5dcb1f41fb756bb38d1c6651381e8fdb4';
const EXPECTED_HTML=1351125;
const EXPECTED_HTML_SHA='71c7f0e7faa1ae682cb59615b5e09e7671b67ccfc736eaffaddbeb4bf0933d03';
const statusEl=document.getElementById('status'),detailEl=document.getElementById('detail'),fill=document.getElementById('fill'),card=document.getElementById('card'),retry=document.getElementById('retry');
const set=(msg,pct,detail='')=>{statusEl.textContent=msg;fill.style.width=`${Math.max(4,Math.min(100,pct))}%`;if(detail)detailEl.textContent=detail;};
const hex=buf=>Array.from(new Uint8Array(buf),b=>b.toString(16).padStart(2,'0')).join('');
async function sha256(bytes){return hex(await crypto.subtle.digest('SHA-256',bytes));}
function decodeBase64Strict(s){
  if(s.length%4!==0)throw new Error(`Base64 desalineado (${s.length})`);
  const T=new Int16Array(128);T.fill(-1);const A='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';for(let i=0;i<A.length;i++)T[A.charCodeAt(i)]=i;
  let pad=0;if(s.endsWith('=='))pad=2;else if(s.endsWith('='))pad=1;
  const out=new Uint8Array((s.length/4)*3-pad);let o=0;
  for(let i=0;i<s.length;i+=4){
    const c0=s.charCodeAt(i),c1=s.charCodeAt(i+1),c2=s.charCodeAt(i+2),c3=s.charCodeAt(i+3);
    const a=c0<128?T[c0]:-1,b=c1<128?T[c1]:-1,c=c2===61?0:(c2<128?T[c2]:-1),d=c3===61?0:(c3<128?T[c3]:-1);
    if(a<0||b<0||c<0||d<0)throw new Error(`Carácter Base64 inválido en posición ${i}`);
    const n=(a<<18)|(b<<12)|(c<<6)|d;
    if(o<out.length)out[o++]=(n>>>16)&255;if(o<out.length)out[o++]=(n>>>8)&255;if(o<out.length)out[o++]=n&255;
  }
  return out;
}
async function fetchText(url,attempts=4){
  let last;for(let i=0;i<attempts;i++){try{const r=await fetch(`${url}?v=${SOURCE_COMMIT}`,{cache:'no-store'});if(!r.ok)throw new Error(`HTTP ${r.status}`);return await r.text();}catch(e){last=e;if(i+1<attempts)await new Promise(r=>setTimeout(r,500*(i+1)));}}
  throw last;
}
async function start(){
  card.classList.remove('error');retry.style.display='none';
  try{
    if(!globalThis.crypto?.subtle)throw new Error('Este navegador no admite verificación SHA-256 segura.');
    if(typeof DecompressionStream!=='function')throw new Error('Este navegador no admite descompresión GZIP nativa. Actualiza Chrome/Android System WebView.');
    const chunks=[];
    for(let i=0;i<PARTS.length;i++){
      set(`Descargando NovaPrime GT…`,5+Math.round((i/PARTS.length)*47),`Bloque ${i+1} de ${PARTS.length}`);
      let txt=(await fetchText(`${BASE}/${PARTS[i]}`)).replace(/\s+/g,'');
      const expected=i===28?18452:19000;
      if(txt.length!==expected)throw new Error(`${PARTS[i]} incompleto: ${txt.length}/${expected}`);
      chunks.push(txt);
    }
    set('Validando paquete…',55,'Comprobando estructura Base64');
    const b64=chunks.join('');if(b64.length!==EXPECTED_B64)throw new Error(`Paquete Base64 incompleto: ${b64.length}/${EXPECTED_B64}`);
    const gzip=decodeBase64Strict(b64);if(gzip.byteLength!==EXPECTED_GZIP)throw new Error(`GZIP incorrecto: ${gzip.byteLength}/${EXPECTED_GZIP}`);
    set('Verificando integridad…',67,'SHA-256 del paquete comprimido');
    const gsha=await sha256(gzip);if(gsha!==EXPECTED_GZIP_SHA)throw new Error(`SHA-256 GZIP no coincide: ${gsha}`);
    set('Abriendo aplicación…',78,'Descomprimiendo NovaPrime GT');
    const stream=new Blob([gzip]).stream().pipeThrough(new DecompressionStream('gzip'));
    const htmlBytes=new Uint8Array(await new Response(stream).arrayBuffer());
    if(htmlBytes.byteLength!==EXPECTED_HTML)throw new Error(`HTML incorrecto: ${htmlBytes.byteLength}/${EXPECTED_HTML}`);
    set('Verificación final…',88,'SHA-256 del HTML');
    const hsha=await sha256(htmlBytes);if(hsha!==EXPECTED_HTML_SHA)throw new Error(`SHA-256 HTML no coincide: ${hsha}`);
    const html=new TextDecoder('utf-8',{fatal:true}).decode(htmlBytes);
    if(!/^\s*<!doctype html/i.test(html)||!/<\/html>\s*$/i.test(html))throw new Error('La estructura HTML final no es válida.');
    set('NovaPrime GT lista',100,`v${VERSION} · ${htmlBytes.byteLength.toLocaleString()} bytes verificados`);
    await new Promise(r=>setTimeout(r,120));
    document.open();document.write(html);document.close();
  }catch(e){console.error('[NovaPrime GT loader]',e);card.classList.add('error');set('No se pudo iniciar NovaPrime GT',100,'Error: '+(e?.message||String(e)));retry.style.display='inline-block';}
}
retry.addEventListener('click',start);start();
})();
</script>
</body>
</html>
